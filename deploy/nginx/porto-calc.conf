# /etc/nginx/conf.d/porto-calc.conf
# Sitio de la calculadora IPv4 por HTTP en el puerto 80.
# Los archivos van en /var/www/porto-calc (copia de la carpeta public/).

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    root   /var/www/porto-calc;
    index  index.html;
    charset utf-8;

    # no mostrar la version de nginx en errores y cabeceras
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/porto-calc.access.log;
    error_log  /var/log/nginx/porto-calc.error.log;
}
